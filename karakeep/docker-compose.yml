services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    container_name: karakeep
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/karakeep/data:/data
    env_file:
      - ../shared.env
    environment:
      - MEILI_ADDR=http://meilisearch-karakeep:7700
      - BROWSER_WEB_URL=http://chrome-karakeep:9222
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      # TODO: change this 
      - NEXTAUTH_URL=http://localhost:3000
      - DATA_DIR=/data
      - CRAWLER_STORE_SCREENSHOT=true
      - CRAWLER_FULL_PAGE_SCREENSHOT=true
      - CRAWLER_FULL_PAGE_ARCHIVE=true
      - CRAWLER_ENABLE_ADBLOCKER=true
      - KARAKEEP_VERSION=release
      - OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta  
      - OPENAI_API_KEY=${GEMINI_API_KEY}
      - INFERENCE_TEXT_MODEL=gemini-2.5-flash
    ports:
      - 3000:3000
  karakeep-chrome:
    image: gcr.io/zenika-hub/alpine-chrome:latest
    container_name: chrome-karakeep
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    env_file:
      - ../shared.env
  karakeep-meilisearch:
    image: getmeili/meilisearch:v1.13.3
    container_name: meilisearch-karakeep
    restart: unless-stopped
    env_file:
      - ../shared.env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ${DATA_DIR}/karakeep/meilisearch:/meili_data
